<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a2018">
<title>Virginia Teen Driver Safety</title>
<meta name="description" content="Virginia teen driver laws, parent guidance, and phone and car safety settings for families with drivers aged 16 to 21.">
<meta property="og:title" content="Virginia Teen Driver Safety">
<meta property="og:description" content="Virginia teen driver laws, parent guidance, and phone and car safety settings for drivers 16 to 21.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128663;</text></svg>">
<style>
:root{
  --ink:#1a1a1a; --muted:#5f5a54; --brand:#7a2018; --brand-soft:#f5f2ed;
  --line:#e2ddd5; --bg:#fdfcfa; --card:#fff;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#e9e5df; --muted:#a8a29a; --brand:#e8836f; --brand-soft:#2a211f;
         --line:#3a3531; --bg:#181614; --card:#1f1d1a; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.6 Georgia,"Times New Roman",serif;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  background:var(--brand); color:#fff; padding:14px 18px;
  padding-top:calc(14px + env(safe-area-inset-top));
  position:sticky; top:0; z-index:20;
}
header a.home{color:#fff;text-decoration:none;display:block}
header h1{margin:0;font:700 17px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:-.2px}
header p{margin:2px 0 0;font:400 12px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;opacity:.85}
nav{
  display:flex; gap:6px; overflow-x:auto; padding:8px 12px;
  background:var(--card); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:15; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav a{
  flex:0 0 auto; padding:7px 13px; border-radius:999px; text-decoration:none;
  font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--muted); border:1px solid var(--line); white-space:nowrap;
}
nav a.on{background:var(--brand); color:#fff; border-color:var(--brand)}
main{max-width:820px; margin:0 auto; padding:20px 18px 60px}
.home-list{list-style:none;padding:0;margin:0}
.home-list li{margin:0 0 12px}
.home-list a{
  display:block; background:var(--card); border:1px solid var(--line);
  border-left:4px solid var(--brand); border-radius:8px; padding:14px 16px;
  text-decoration:none; color:var(--ink);
}
.home-list strong{display:block;font:700 16px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--brand);margin-bottom:3px}
.home-list span{font-size:14px;color:var(--muted)}
article h1{font:700 27px/1.15 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--brand);margin:0 0 6px;letter-spacing:-.5px}
article h1+h3{font:400 16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--muted);margin:0 0 18px;border:0;padding:0}
article h2{font:700 15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;background:var(--brand);padding:8px 12px;border-radius:5px;margin:30px 0 14px;letter-spacing:.2px}
article h3{font:700 15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--brand);margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
article p{margin:0 0 12px}
article strong{color:var(--ink)}
article ul,article ol{padding-left:22px;margin:0 0 14px}
article li{margin-bottom:7px}
article ul.task-list{list-style:none;padding-left:2px}
article ul.task-list li{position:relative;padding-left:28px;margin-bottom:11px}
article ul.task-list input[type=checkbox]{
  position:absolute;left:0;top:4px;width:19px;height:19px;accent-color:var(--brand);cursor:pointer;
}
article table{width:100%;border-collapse:collapse;margin:14px 0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:block;overflow-x:auto}
article th{background:var(--brand);color:#fff;text-align:left;padding:8px 10px;font-weight:700;white-space:nowrap}
article td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
article blockquote{border-left:4px solid var(--brand);background:var(--brand-soft);margin:16px 0;padding:12px 14px;border-radius:0 6px 6px 0;font-style:italic}
article blockquote p:last-child{margin:0}
article hr{border:0;border-top:1px solid var(--line);margin:24px 0}
article em{color:var(--muted)}
article a{color:var(--brand)}
article code{font-family:inherit}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.toolbar button,.toolbar a.btn{
  font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:9px 14px;border-radius:6px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);cursor:pointer;text-decoration:none;
}
.meta{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--muted);margin:0 0 16px}
footer{border-top:1px solid var(--line);margin-top:40px;padding:18px;text-align:center;
  font:12px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--muted)}
.loading{color:var(--muted);font-style:italic}
.err{background:var(--brand-soft);border-left:4px solid var(--brand);padding:14px;border-radius:0 6px 6px 0}
@media print{
  header,nav,.toolbar,footer{display:none!important}
  body{background:#fff;color:#000;font-size:10.5pt}
  main{max-width:none;padding:0}
  article h2{background:#7a2018!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  article th{background:#7a2018!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  article h2,article h3{page-break-after:avoid}
  article table,article blockquote{page-break-inside:avoid}
}
</style>
</head>
<body>

<header>
  <a class="home" href="#/">
    <h1>Virginia Teen Driver Safety</h1>
    <p>For families with drivers aged 16 to 21</p>
  </a>
</header>

<nav id="nav"></nav>

<main id="main"><p class="loading">Loading...</p></main>

<footer>
  <p>Made by Jayakanthan. Found an error? Text or call 804-200-9350 so it can be corrected.<br>
  Free to copy and share. Not legal advice.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const DOCS = [
  { id:'guide',     file:'content/guide.md',     nav:'The Guide',
    title:'The Virginia Road Guide',
    blurb:'Virginia law and parent guidance for every stage, from learner\u2019s permit through age 21.' },
  { id:'checklist', file:'content/checklist.md', nav:'Setup Checklist',
    title:'20 Minutes That Could Save Your Teen\u2019s Life',
    blurb:'Crash detection and speed controls on the phone and car you already own.' },
  { id:'tesla',     file:'content/tesla.md',     nav:'Tesla Settings',
    title:'Tesla Settings for a Teen Driver',
    blurb:'Parental Controls, lane departure, and the one setting that switches everything off.' },
  { id:'agreement', file:'content/agreement.md', nav:'Driving Agreement',
    title:'Parent-Teen Driving Agreement',
    blurb:'A printable agreement to fill in and sign together before the first solo drive.' }
];

const $ = s => document.querySelector(s);
const cache = {};

function buildNav(active){
  $('#nav').innerHTML =
    `<a href="#/" class="${active?'':'on'}">Home</a>` +
    DOCS.map(d => `<a href="#/${d.id}" class="${active===d.id?'on':''}">${d.nav}</a>`).join('');
}

function renderHome(){
  buildNav(null);
  $('#main').innerHTML =
    `<p class="meta">Four documents. Everything here is free to read, print, and share.
     Tick boxes as you work through the checklists - they are just for your own place-keeping and are not saved.</p>
     <ul class="home-list">` +
    DOCS.map(d => `<li><a href="#/${d.id}"><strong>${d.title}</strong><span>${d.blurb}</span></a></li>`).join('') +
    `</ul>`;
  document.title = 'Virginia Teen Driver Safety';
  window.scrollTo(0,0);
}

async function renderDoc(id){
  const doc = DOCS.find(d => d.id === id);
  if (!doc) return renderHome();
  buildNav(id);
  document.title = doc.title + ' | Virginia Teen Driver Safety';

  if (!cache[id]){
    $('#main').innerHTML = '<p class="loading">Loading...</p>';
    try {
      const res = await fetch(doc.file + '?v=' + Date.now());
      if (!res.ok) throw new Error(res.status);
      cache[id] = await res.text();
    } catch (e) {
      $('#main').innerHTML =
        `<div class="err"><p><strong>Could not load this page.</strong></p>
         <p>Check your connection and reload. If it keeps failing, text 804-200-9350.</p></div>`;
      return;
    }
  }

  const html = marked.parse(cache[id], { gfm:true, breaks:false });
  $('#main').innerHTML =
    `<div class="toolbar">
       <button onclick="window.print()">Print / Save PDF</button>
       <button id="share">Share</button>
     </div>
     <article>${html}</article>`;

  // make rendered checkboxes tickable (marked outputs them disabled)
  document.querySelectorAll('#main input[type=checkbox]').forEach(c => c.disabled = false);
  document.querySelectorAll('#main ul').forEach(u => {
    if (u.querySelector(':scope > li > input[type=checkbox]')) u.classList.add('task-list');
  });

  const btn = $('#share');
  btn.onclick = async () => {
    const url = location.href;
    if (navigator.share){
      try { await navigator.share({ title: doc.title, url }); return; } catch(e){ /* cancelled */ }
    }
    try { await navigator.clipboard.writeText(url); btn.textContent = 'Link copied'; }
    catch(e){ btn.textContent = url; }
  };

  window.scrollTo(0,0);
}

function route(){
  const id = (location.hash || '#/').replace(/^#\/?/, '');
  id ? renderDoc(id) : renderHome();
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
